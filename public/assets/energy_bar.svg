<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="60%" stop-color="#F5EFE0" />
      <stop offset="100%" stop-color="#E5D9C0" />
    </radialGradient>
    <linearGradient id="barTexture" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#542B14" />
      <stop offset="50%" stop-color="#3A1A0B" />
      <stop offset="100%" stop-color="#240E05" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="14" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.4" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="600" height="500" fill="url(#bgLight)" />
  <ellipse cx="300" cy="420" rx="220" ry="40" fill="#1A0D05" opacity="0.35" />

  <!-- Parchment Paper Background -->
  <polygon points="120,380 480,360 460,250 140,270" fill="#FFF9E6" stroke="#D7C9AA" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Stacked Date & Seed Bars -->
  <!-- Bar 1 (Bottom) -->
  <g transform="translate(180, 290) rotate(-8)">
    <rect width="240" height="65" rx="8" fill="url(#barTexture)" stroke="#8D4E24" stroke-width="2" filter="url(#dropShadow)" />
    <!-- Visible nuts and seeds inside bar -->
    <g fill="#FFE082" opacity="0.85"><rect x="30" y="15" width="20" height="12" rx="4" /><rect x="90" y="35" width="25" height="14" rx="5" /><rect x="160" y="20" width="22" height="12" rx="4" /></g>
    <g fill="#8BC34A" opacity="0.85"><circle cx="70" cy="25" r="4" /><circle cx="130" cy="45" r="5" /><circle cx="200" cy="30" r="4" /></g>
    <g fill="#FFFFFF" opacity="0.75"><circle cx="45" cy="45" r="2" /><circle cx="115" cy="20" r="2" /><circle cx="180" cy="45" r="2" /></g>
  </g>

  <!-- Bar 2 (Middle) -->
  <g transform="translate(190, 230) rotate(5)">
    <rect width="240" height="65" rx="8" fill="url(#barTexture)" stroke="#A75D2C" stroke-width="2" filter="url(#dropShadow)" />
    <g fill="#FFE082" opacity="0.85"><rect x="40" y="25" width="24" height="13" rx="5" /><rect x="110" y="15" width="22" height="12" rx="4" /><rect x="170" y="35" width="25" height="14" rx="5" /></g>
    <g fill="#8BC34A" opacity="0.85"><circle cx="85" cy="40" r="4" /><circle cx="145" cy="25" r="4.5" /><circle cx="210" cy="45" r="4" /></g>
    <g fill="#FFFFFF" opacity="0.75"><circle cx="30" cy="20" r="2" /><circle cx="130" cy="45" r="2" /><circle cx="195" cy="20" r="2" /></g>
  </g>

  <!-- Bar 3 (Top) -->
  <g transform="translate(175, 160) rotate(-3)">
    <rect width="240" height="65" rx="8" fill="url(#barTexture)" stroke="#C4733A" stroke-width="2.5" filter="url(#dropShadow)" />
    <g fill="#FFE082" opacity="0.9"><rect x="25" y="20" width="25" height="14" rx="5" /><rect x="95" y="30" width="26" height="14" rx="5" /><rect x="165" y="15" width="24" height="13" rx="4" /></g>
    <g fill="#8BC34A" opacity="0.9"><circle cx="65" cy="35" r="4.5" /><circle cx="135" cy="20" r="5" /><circle cx="205" cy="35" r="4.5" /></g>
    <g fill="#FFFFFF" opacity="0.8"><circle cx="50" cy="50" r="2" /><circle cx="120" cy="45" r="2" /><circle cx="185" cy="45" r="2" /></g>
  </g>

  <!-- Badge -->
  <g transform="translate(420, 50)">
    <circle cx="45" cy="45" r="42" fill="#123B27" stroke="#C6A15B" stroke-width="2.5" />
    <text x="45" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#C6A15B" text-anchor="middle" letter-spacing="1">NO SUGAR</text>
    <text x="45" y="56" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ডেট বার</text>
  </g>
</svg>
