<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="60%" stop-color="#F7F1E1" />
      <stop offset="100%" stop-color="#EADBBE" />
    </radialGradient>
    <linearGradient id="woodTable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A2E18" />
      <stop offset="25%" stop-color="#5C3B1F" />
      <stop offset="50%" stop-color="#6B4524" />
      <stop offset="75%" stop-color="#54361C" />
      <stop offset="100%" stop-color="#3E2412" />
    </linearGradient>
    <linearGradient id="tableHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C6B3E" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#734B24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A0D05" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Ghee Jar Gradients -->
    <linearGradient id="gheeLiquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="30%" stop-color="#FBC02D" />
      <stop offset="70%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <radialGradient id="gheeGranular" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FDD835" />
      <stop offset="80%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#D84315" />
    </radialGradient>
    <linearGradient id="glassReflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="goldLid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8D6E63" />
    </linearGradient>

    <!-- Dates Gradients -->
    <radialGradient id="dateGloss1" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4A2511" />
      <stop offset="45%" stop-color="#241006" />
      <stop offset="80%" stop-color="#140702" />
      <stop offset="100%" stop-color="#080201" />
    </radialGradient>
    <radialGradient id="dateGloss2" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#663319" />
      <stop offset="50%" stop-color="#331405" />
      <stop offset="90%" stop-color="#1A0A03" />
      <stop offset="100%" stop-color="#050100" />
    </radialGradient>

    <!-- Almond Gradients -->
    <radialGradient id="almondSkin" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C4884D" />
      <stop offset="60%" stop-color="#9C5E28" />
      <stop offset="100%" stop-color="#5E320D" />
    </radialGradient>

    <!-- Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dx="0" dy="18" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGlow)" />

  <!-- Botanical Leaves in Background -->
  <g opacity="0.12" fill="#123B27">
    <path d="M100,50 Q200,120 180,240 Q120,180 100,50 Z" />
    <path d="M1100,80 Q1000,160 1020,280 Q1080,200 1100,80 Z" />
    <path d="M50,400 Q150,380 170,480 Q90,480 50,400 Z" />
  </g>

  <!-- Warm Wooden Table Surface -->
  <ellipse cx="600" cy="620" rx="560" ry="170" fill="url(#woodTable)" filter="url(#softShadow)" />
  <ellipse cx="600" cy="620" rx="560" ry="170" fill="url(#tableHighlight)" />

  <!-- Deep Floor Contact Shadow -->
  <ellipse cx="600" cy="670" rx="460" ry="60" fill="#140B04" opacity="0.75" />

  <!-- ======================================================================
       LEFT SIDE: Artisanal Wooden Bowl Heaped with Premium Dark Ajwa Dates
       ====================================================================== -->
  <g transform="translate(180, 410)">
    <!-- Bowl Shadow -->
    <ellipse cx="140" cy="220" rx="150" ry="40" fill="#140702" opacity="0.6" />
    
    <!-- Wooden Bowl Outer Base -->
    <ellipse cx="140" cy="180" rx="140" ry="70" fill="#3D200F" stroke="#261206" stroke-width="4" />
    <path d="M0,180 Q140,240 280,180 L250,210 Q140,260 30,210 Z" fill="#2E1609" />

    <!-- Dates Heap in Bowl -->
    <!-- Date 1 -->
    <ellipse cx="90" cy="160" rx="38" ry="24" transform="rotate(-15, 90, 160)" fill="url(#dateGloss1)" />
    <path d="M65,152 Q90,146 115,155" stroke="#8D4E24" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Date 2 -->
    <ellipse cx="150" cy="170" rx="42" ry="26" transform="rotate(10, 150, 170)" fill="url(#dateGloss2)" />
    <path d="M125,162 Q150,156 175,165" stroke="#A75D2C" stroke-width="2.5" fill="none" opacity="0.7" />

    <!-- Date 3 -->
    <ellipse cx="200" cy="155" rx="36" ry="22" transform="rotate(25, 200, 155)" fill="url(#dateGloss1)" />

    <!-- Date 4 (Upper layer) -->
    <ellipse cx="110" cy="135" rx="40" ry="25" transform="rotate(-25, 110, 135)" fill="url(#dateGloss2)" />
    <path d="M85,128 Q110,120 135,130" stroke="#C4733A" stroke-width="3" fill="none" opacity="0.8" />

    <!-- Date 5 (Peak) -->
    <ellipse cx="160" cy="130" rx="42" ry="26" transform="rotate(5, 160, 130)" fill="url(#dateGloss1)" />
    <path d="M135,122 Q160,115 185,125" stroke="#C4733A" stroke-width="3" fill="none" opacity="0.85" />

    <!-- Date 6 -->
    <ellipse cx="135" cy="105" rx="38" ry="23" transform="rotate(-8, 135, 105)" fill="url(#dateGloss2)" />
    <path d="M115,98 Q135,92 155,100" stroke="#FF9E59" stroke-width="2.5" fill="none" opacity="0.7" />

    <!-- Label Banner for Bowl -->
    <rect x="70" y="215" width="140" height="24" rx="12" fill="#123B27" stroke="#C6A15B" stroke-width="1.5" />
    <text x="140" y="231" font-family="'Noto Serif Bengali', serif" font-size="11" font-weight="700" fill="#FFF8E7" text-anchor="middle">মদিনার আজওয়া খেজুর</text>
  </g>

  <!-- ======================================================================
       CENTER: Pure Desi Cow Ghee Glass Jar with Golden Clarified Butter & Dipper
       ====================================================================== -->
  <g transform="translate(480, 220)">
    <!-- Main Jar Shadow -->
    <ellipse cx="120" cy="430" rx="130" ry="45" fill="#0E0602" opacity="0.7" />

    <!-- Jar Body (Clear Thick Glass with Golden Ghee) -->
    <rect x="25" y="140" width="190" height="260" rx="28" fill="url(#gheeGranular)" stroke="#C6A15B" stroke-width="2" />

    <!-- Granular Ghee Texture Specks -->
    <g fill="#FFF9C4" opacity="0.45">
      <circle cx="50" cy="200" r="4" />
      <circle cx="80" cy="240" r="5" />
      <circle cx="140" cy="220" r="4" />
      <circle cx="170" cy="260" r="6" />
      <circle cx="90" cy="320" r="5" />
      <circle cx="150" cy="340" r="4" />
      <circle cx="60" cy="360" r="5" />
      <circle cx="120" cy="280" r="6" />
      <circle cx="180" cy="320" r="4" />
    </g>

    <!-- Glass Reflections & Gloss -->
    <rect x="35" y="150" width="25" height="240" rx="12" fill="url(#glassReflection)" />
    <rect x="180" y="150" width="18" height="240" rx="9" fill="url(#glassReflection)" />

    <!-- Pure Ghee Label -->
    <rect x="40" y="210" width="160" height="130" rx="10" fill="#123B27" stroke="#C6A15B" stroke-width="2" />
    <rect x="46" y="216" width="148" height="118" rx="7" fill="none" stroke="#C6A15B" stroke-width="1" stroke-dasharray="4,2" />

    <text x="120" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#C6A15B" text-anchor="middle" letter-spacing="2">URMIRA</text>
    <text x="120" y="266" font-family="'Noto Serif Bengali', serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">খাঁটি দেশি গরুর ঘি</text>
    <text x="120" y="284" font-family="'Noto Serif Bengali', serif" font-size="11" font-weight="600" fill="#D1FAE5" text-anchor="middle">ঐতিহ্যবাহী বিলোনা পদ্ধতি</text>
    <rect x="65" y="296" width="110" height="20" rx="10" fill="#C6A15B" />
    <text x="120" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#173021" text-anchor="middle">100% PURE &amp; NATURAL</text>

    <!-- Jar Neck & Gold Lid -->
    <rect x="45" y="115" width="150" height="30" rx="6" fill="url(#goldLid)" stroke="#8D6E63" stroke-width="1.5" />
    <rect x="40" y="85" width="160" height="35" rx="8" fill="url(#goldLid)" stroke="#FFE082" stroke-width="2" />
    <line x1="45" y1="102" x2="195" y2="102" stroke="#FFF8E7" stroke-width="2" opacity="0.6" />

    <!-- Traditional Wooden Ghee Dipper with Dripping Golden Ghee -->
    <g transform="translate(160, 40) rotate(22)">
      <!-- Dipper Handle -->
      <rect x="18" y="0" width="12" height="220" rx="6" fill="#8D5B28" stroke="#543310" stroke-width="1.5" />
      <!-- Dipper Rings -->
      <ellipse cx="24" cy="190" rx="22" ry="12" fill="#6D3F14" />
      <ellipse cx="24" cy="205" rx="24" ry="13" fill="#8D5B28" />
      <ellipse cx="24" cy="220" rx="22" ry="12" fill="#543310" />

      <!-- Dripping Liquid Ghee -->
      <path d="M18,220 C18,250 14,270 24,285 C34,270 30,250 30,220 Z" fill="url(#gheeLiquid)" />
      <circle cx="24" cy="296" r="6" fill="#FDD835" />
      <circle cx="24" cy="312" r="4" fill="#FBC02D" />
    </g>
  </g>

  <!-- ======================================================================
       RIGHT SIDE: Ceramic Bowl Heaped with Whole Roasted Almonds & Mixed Nuts
       ====================================================================== -->
  <g transform="translate(740, 420)">
    <!-- Bowl Shadow -->
    <ellipse cx="140" cy="210" rx="140" ry="40" fill="#140702" opacity="0.6" />

    <!-- Ceramic Cream Bowl -->
    <ellipse cx="140" cy="170" rx="135" ry="65" fill="#F4EADB" stroke="#D7C4A8" stroke-width="3" />
    <path d="M10,170 Q140,240 270,170 L240,200 Q140,255 40,200 Z" fill="#E8D8C3" />

    <!-- Heaped Almonds -->
    <ellipse cx="70" cy="150" rx="24" ry="15" transform="rotate(-30, 70, 150)" fill="url(#almondSkin)" />
    <ellipse cx="110" cy="160" rx="26" ry="16" transform="rotate(20, 110, 160)" fill="url(#almondSkin)" />
    <ellipse cx="160" cy="155" rx="25" ry="15" transform="rotate(-10, 160, 155)" fill="url(#almondSkin)" />
    <ellipse cx="205" cy="145" rx="24" ry="14" transform="rotate(35, 205, 145)" fill="url(#almondSkin)" />

    <!-- Cashews (Creamy White/Gold) -->
    <path d="M125,125 Q145,115 155,130 Q145,145 130,138 Z" fill="#FFF3D6" stroke="#D4B680" stroke-width="1.5" />
    <path d="M85,130 Q105,120 115,135 Q105,150 90,143 Z" fill="#FFF3D6" stroke="#D4B680" stroke-width="1.5" />

    <!-- Upper Almond Layer -->
    <ellipse cx="100" cy="120" rx="26" ry="16" transform="rotate(-15, 100, 120)" fill="url(#almondSkin)" />
    <ellipse cx="145" cy="115" rx="26" ry="16" transform="rotate(15, 145, 115)" fill="url(#almondSkin)" />
    <ellipse cx="180" cy="125" rx="24" ry="15" transform="rotate(-25, 180, 125)" fill="url(#almondSkin)" />

    <!-- Peak Pistachio (Green/Purple accent) -->
    <ellipse cx="130" cy="95" rx="18" ry="12" fill="#8BC34A" stroke="#558B2F" stroke-width="1.5" />

    <!-- Label Banner for Nuts -->
    <rect x="70" y="210" width="140" height="24" rx="12" fill="#123B27" stroke="#C6A15B" stroke-width="1.5" />
    <text x="140" y="226" font-family="'Noto Serif Bengali', serif" font-size="11" font-weight="700" fill="#FFF8E7" text-anchor="middle">কাঠবাদাম ও মিক্সড নাটস</text>
  </g>

  <!-- Floating Purity Certificate Badge -->
  <g transform="translate(80, 100)">
    <rect width="210" height="64" rx="14" fill="#FFFFFF" stroke="#C6A15B" stroke-width="2" filter="url(#softShadow)" />
    <circle cx="36" cy="32" r="18" fill="#123B27" />
    <path d="M28,32 L34,38 L45,26" fill="none" stroke="#C6A15B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="27" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="700" fill="#123B27">১০০% প্রাকৃতিক ও বিশুদ্ধ</text>
    <text x="64" y="44" font-family="'Noto Serif Bengali', serif" font-size="11" font-weight="600" fill="#A8833E">ঘরোয়া ঐতিহ্যের স্বাদ</text>
  </g>
</svg>
