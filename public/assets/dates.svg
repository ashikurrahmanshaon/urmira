<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="60%" stop-color="#F5EFE0" />
      <stop offset="100%" stop-color="#E5D9C0" />
    </radialGradient>
    <radialGradient id="dateGloss1" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#542B14" />
      <stop offset="45%" stop-color="#2B1408" />
      <stop offset="85%" stop-color="#140702" />
      <stop offset="100%" stop-color="#050100" />
    </radialGradient>
    <radialGradient id="dateGloss2" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#6E381A" />
      <stop offset="50%" stop-color="#381706" />
      <stop offset="90%" stop-color="#1A0A03" />
      <stop offset="100%" stop-color="#050100" />
    </radialGradient>
    <linearGradient id="bowlWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A3215" />
      <stop offset="50%" stop-color="#3D200B" />
      <stop offset="100%" stop-color="#241104" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="14" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.4" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#bgLight)" />

  <!-- Soft Shadow -->
  <ellipse cx="300" cy="420" rx="220" ry="45" fill="#1A0D05" opacity="0.4" />

  <!-- Wooden Bowl Base -->
  <ellipse cx="300" cy="360" rx="200" ry="85" fill="url(#bowlWood)" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="345" rx="190" ry="75" fill="#42240E" stroke="#683A18" stroke-width="3" />

  <!-- Heap of Ajwa Dates (Lower Layer) -->
  <ellipse cx="200" cy="320" rx="55" ry="34" transform="rotate(-20, 200, 320)" fill="url(#dateGloss1)" />
  <path d="M165,310 Q200,300 235,312" stroke="#8D4E24" stroke-width="3" fill="none" opacity="0.7" />

  <ellipse cx="270" cy="330" rx="58" ry="36" transform="rotate(10, 270, 330)" fill="url(#dateGloss2)" />
  <path d="M235,320 Q270,310 305,322" stroke="#A75D2C" stroke-width="3" fill="none" opacity="0.8" />

  <ellipse cx="340" cy="325" rx="56" ry="35" transform="rotate(-10, 340, 325)" fill="url(#dateGloss1)" />
  <ellipse cx="400" cy="315" rx="52" ry="32" transform="rotate(25, 400, 315)" fill="url(#dateGloss2)" />

  <!-- Dates (Middle Layer) -->
  <ellipse cx="230" cy="275" rx="56" ry="35" transform="rotate(-25, 230, 275)" fill="url(#dateGloss2)" />
  <path d="M195,265 Q230,252 265,268" stroke="#C4733A" stroke-width="3.5" fill="none" opacity="0.85" />

  <ellipse cx="300" cy="280" rx="60" ry="38" transform="rotate(5, 300, 280)" fill="url(#dateGloss1)" />
  <path d="M265,270 Q300,258 335,272" stroke="#C4733A" stroke-width="3.5" fill="none" opacity="0.85" />

  <ellipse cx="370" cy="270" rx="55" ry="34" transform="rotate(20, 370, 270)" fill="url(#dateGloss2)" />

  <!-- Dates (Peak Layer) -->
  <ellipse cx="270" cy="225" rx="54" ry="33" transform="rotate(-12, 270, 225)" fill="url(#dateGloss2)" />
  <path d="M240,215 Q270,205 300,218" stroke="#FF9E59" stroke-width="3" fill="none" opacity="0.8" />

  <ellipse cx="330" cy="220" rx="55" ry="34" transform="rotate(15, 330, 220)" fill="url(#dateGloss1)" />
  <path d="M300,210 Q330,200 360,212" stroke="#FF9E59" stroke-width="3" fill="none" opacity="0.85" />

  <ellipse cx="300" cy="180" rx="50" ry="31" transform="rotate(-5, 300, 180)" fill="url(#dateGloss2)" />
  <path d="M275,170 Q300,162 325,174" stroke="#FFB787" stroke-width="3" fill="none" opacity="0.9" />

  <!-- 2 Loose Fresh Dates on Table -->
  <ellipse cx="140" cy="400" rx="45" ry="28" transform="rotate(-15, 140, 400)" fill="url(#dateGloss2)" />
  <ellipse cx="460" cy="405" rx="46" ry="29" transform="rotate(25, 460, 405)" fill="url(#dateGloss1)" />

  <!-- Product Seal -->
  <g transform="translate(420, 50)">
    <circle cx="45" cy="45" r="42" fill="#123B27" stroke="#C6A15B" stroke-width="2.5" />
    <text x="45" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#C6A15B" text-anchor="middle" letter-spacing="1">100% PURE</text>
    <text x="45" y="56" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">আজওয়া</text>
  </g>
</svg>
