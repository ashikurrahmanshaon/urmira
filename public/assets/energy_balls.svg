<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="60%" stop-color="#F5EFE0" />
      <stop offset="100%" stop-color="#E5D9C0" />
    </radialGradient>
    <radialGradient id="ballDateNut" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#5E3219" />
      <stop offset="45%" stop-color="#3A1C0C" />
      <stop offset="85%" stop-color="#1A0A03" />
      <stop offset="100%" stop-color="#080201" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="14" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.4" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="600" height="500" fill="url(#bgLight)" />
  <ellipse cx="300" cy="420" rx="230" ry="45" fill="#1A0D05" opacity="0.35" />

  <!-- Slate / Ceramic Serving Platter -->
  <ellipse cx="300" cy="360" rx="220" ry="85" fill="#2C3E35" filter="url(#dropShadow)" stroke="#C6A15B" stroke-width="2" />
  <ellipse cx="300" cy="350" rx="205" ry="75" fill="#1E2D26" stroke="#123B27" stroke-width="2" />

  <!-- Energy Balls (Laddus / Truffles) Layer 1 -->
  <!-- Ball 1 -->
  <g transform="translate(190, 310)">
    <circle cx="45" cy="45" r="45" fill="url(#ballDateNut)" />
    <!-- Crushed Pistachio / Almond Specks -->
    <g fill="#8BC34A" opacity="0.85"><circle cx="25" cy="30" r="3" /><circle cx="40" cy="20" r="2.5" /><circle cx="65" cy="35" r="3" /><circle cx="50" cy="60" r="3.5" /></g>
    <g fill="#FFE082" opacity="0.85"><circle cx="35" cy="45" r="3" /><circle cx="55" cy="25" r="2.5" /><circle cx="30" cy="65" r="3" /><circle cx="60" cy="55" r="3" /></g>
  </g>

  <!-- Ball 2 -->
  <g transform="translate(280, 320)">
    <circle cx="45" cy="45" r="45" fill="url(#ballDateNut)" />
    <g fill="#8BC34A" opacity="0.85"><circle cx="30" cy="25" r="3" /><circle cx="60" cy="30" r="3" /><circle cx="45" cy="55" r="3.5" /></g>
    <g fill="#FFE082" opacity="0.85"><circle cx="20" cy="45" r="3" /><circle cx="55" cy="45" r="3" /><circle cx="40" cy="30" r="3" /></g>
  </g>

  <!-- Ball 3 -->
  <g transform="translate(370, 305)">
    <circle cx="42" cy="42" r="42" fill="url(#ballDateNut)" />
    <g fill="#8BC34A" opacity="0.85"><circle cx="25" cy="30" r="3" /><circle cx="55" cy="35" r="3" /><circle cx="40" cy="55" r="3" /></g>
    <g fill="#FFE082" opacity="0.85"><circle cx="35" cy="20" r="3" /><circle cx="50" cy="50" r="3" /></g>
  </g>

  <!-- Energy Balls Upper Layer -->
  <!-- Ball 4 -->
  <g transform="translate(235, 235)">
    <circle cx="45" cy="45" r="45" fill="url(#ballDateNut)" />
    <g fill="#8BC34A" opacity="0.9"><circle cx="30" cy="30" r="3.5" /><circle cx="55" cy="25" r="3" /><circle cx="65" cy="50" r="3" /><circle cx="40" cy="60" r="3.5" /></g>
    <g fill="#FFE082" opacity="0.9"><circle cx="20" cy="45" r="3" /><circle cx="45" cy="20" r="3" /><circle cx="55" cy="45" r="3" /><circle cx="35" cy="55" r="3" /></g>
  </g>

  <!-- Ball 5 -->
  <g transform="translate(325, 230)">
    <circle cx="45" cy="45" r="45" fill="url(#ballDateNut)" />
    <g fill="#8BC34A" opacity="0.9"><circle cx="25" cy="25" r="3" /><circle cx="60" cy="35" r="3.5" /><circle cx="45" cy="55" r="3" /></g>
    <g fill="#FFE082" opacity="0.9"><circle cx="40" cy="25" r="3" /><circle cx="20" cy="50" r="3" /><circle cx="55" cy="55" r="3" /></g>
  </g>

  <!-- Top Peak Ball -->
  <g transform="translate(280, 155)">
    <circle cx="45" cy="45" r="45" fill="url(#ballDateNut)" />
    <g fill="#8BC34A" opacity="0.95"><circle cx="30" cy="25" r="3.5" /><circle cx="55" cy="30" r="3" /><circle cx="45" cy="55" r="3.5" /><circle cx="65" cy="50" r="3" /></g>
    <g fill="#FFE082" opacity="0.95"><circle cx="20" cy="40" r="3" /><circle cx="45" cy="20" r="3.5" /><circle cx="55" cy="45" r="3" /><circle cx="35" cy="60" r="3" /></g>
  </g>

  <!-- Badge -->
  <g transform="translate(420, 50)">
    <circle cx="45" cy="45" r="42" fill="#123B27" stroke="#C6A15B" stroke-width="2.5" />
    <text x="45" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#C6A15B" text-anchor="middle" letter-spacing="1">SUGAR FREE</text>
    <text x="45" y="56" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">এনার্জি বল</text>
  </g>
</svg>
