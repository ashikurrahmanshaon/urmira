<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="60%" stop-color="#F5EFE0" />
      <stop offset="100%" stop-color="#E5D9C0" />
    </radialGradient>
    <radialGradient id="gheeGranular" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FDD835" />
      <stop offset="80%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#D84315" />
    </radialGradient>
    <linearGradient id="goldLid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8D6E63" />
    </linearGradient>
    <linearGradient id="glassReflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="16" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="600" height="500" fill="url(#bgLight)" />
  <ellipse cx="300" cy="430" rx="200" ry="40" fill="#1A0D05" opacity="0.4" />

  <!-- Ghee Jar Body -->
  <g transform="translate(160, 40)">
    <rect x="50" y="110" width="180" height="260" rx="28" fill="url(#gheeGranular)" stroke="#C6A15B" stroke-width="2.5" filter="url(#dropShadow)" />

    <!-- Specks of granular clarified butter -->
    <g fill="#FFF9C4" opacity="0.5">
      <circle cx="75" cy="160" r="4" /><circle cx="110" cy="190" r="5" /><circle cx="160" cy="170" r="4" />
      <circle cx="190" cy="210" r="5" /><circle cx="90" cy="270" r="5" /><circle cx="170" cy="290" r="4" />
      <circle cx="130" cy="330" r="6" /><circle cx="70" cy="320" r="4" /><circle cx="200" cy="330" r="5" />
    </g>

    <!-- Reflections -->
    <rect x="60" y="120" width="22" height="240" rx="10" fill="url(#glassReflection)" />
    <rect x="195" y="120" width="16" height="240" rx="8" fill="url(#glassReflection)" />

    <!-- Label -->
    <rect x="60" y="180" width="160" height="130" rx="10" fill="#123B27" stroke="#C6A15B" stroke-width="2" />
    <rect x="66" y="186" width="148" height="118" rx="7" fill="none" stroke="#C6A15B" stroke-width="1" stroke-dasharray="4,2" />
    <text x="140" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#C6A15B" text-anchor="middle" letter-spacing="2">URMIRA</text>
    <text x="140" y="238" font-family="'Noto Serif Bengali', serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">খাঁটি দেশি গরুর ঘি</text>
    <text x="140" y="256" font-family="'Noto Serif Bengali', serif" font-size="11" font-weight="600" fill="#D1FAE5" text-anchor="middle">ঐতিহ্যবাহী বিলোনা পদ্ধতি</text>
    <rect x="85" y="268" width="110" height="20" rx="10" fill="#C6A15B" />
    <text x="140" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#173021" text-anchor="middle">100% PURE BILONA</text>

    <!-- Gold Lid & Neck -->
    <rect x="70" y="85" width="140" height="28" rx="6" fill="url(#goldLid)" stroke="#8D6E63" stroke-width="1.5" />
    <rect x="65" y="55" width="150" height="34" rx="8" fill="url(#goldLid)" stroke="#FFE082" stroke-width="2" />
    <line x1="70" y1="72" x2="210" y2="72" stroke="#FFF8E7" stroke-width="2" opacity="0.6" />

    <!-- Wooden Dipper -->
    <g transform="translate(195, 15) rotate(25)">
      <rect x="18" y="0" width="10" height="200" rx="5" fill="#8D5B28" stroke="#543310" stroke-width="1.5" />
      <ellipse cx="23" cy="170" rx="18" ry="10" fill="#6D3F14" />
      <ellipse cx="23" cy="184" rx="20" ry="11" fill="#8D5B28" />
      <ellipse cx="23" cy="198" rx="18" ry="10" fill="#543310" />
      <path d="M18,198 C18,225 14,240 23,255 C32,240 28,225 28,198 Z" fill="#FDD835" />
      <circle cx="23" cy="265" r="5" fill="#FBC02D" />
    </g>
  </g>
</svg>
